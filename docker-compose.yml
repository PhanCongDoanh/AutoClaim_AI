services:
  db:
    image: postgres:17-alpine
    container_name: autoclaim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 180704@db
      POSTGRES_DB: autoclaim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoclaim_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoclaim-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/autoclaim_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 180704@db
      # Gọi AI qua tên service "ai" trong mạng nội bộ Docker
      APP_AI_DETECT_URL: http://ai:5000/api/ai/detect
      APP_AI_STATUS_URL: http://ai:5000/api/ai/status
      # Giờ Việt Nam cho các mốc thời gian JVM tự sinh (created_at), khớp với expectedReturnAt do frontend gửi
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh -Djava.awt.headless=true -Xmx512m

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: autoclaim-ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"   # chỉ để mở http://localhost:5000/docs test; macOS bị AirPlay chiếm 5000 thì đổi thành "5001:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: autoclaim_db
      DB_USER: postgres
      DB_PASSWORD: 180704@db
      DEVICE: cpu
      DAMAGE_MODEL: weights/damage_best.pt
      PART_MODEL: weights/parts_best.pt
    volumes:
      - ./ai-service/weights:/app/weights   # thay file .pt mới -> chỉ cần restart, không cần build lại

volumes:
  postgres_data:
