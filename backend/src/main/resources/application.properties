spring.application.name=backend

# ===============================
# SERVER & MULTIPART UPLOAD
# ===============================
server.port=8080

# Cực kỳ quan trọng: Tăng giới hạn payload để tránh lỗi 413 Payload Too Large khi gửi nhiều ảnh
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# POSTGRESQL DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoclaim_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:180704@db}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Flyway sẽ tự động đọc các file .sql nằm trong thư mục: src/main/resources/db/migration

# ===============================
# SPRING DATA JPA & HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Giao toàn quyền quản lý schema cho Flyway. Hibernate chỉ đối chiếu (validate) entity với bảng thực tế
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# S3-COMPATIBLE OBJECT STORAGE (Cloudflare R2 / MinIO / AWS S3)
# ===============================
s3.endpoint=https://ltgidihkehlbivwfkqrh.storage.supabase.co/storage/v1/s3
# R2 uses "auto"; MinIO accepts any value (e.g. us-east-1)
s3.region=ap-southeast-1
s3.access-key=c850913de33f14860c9b611d6ee120b8
s3.secret-key=d358694839e4b5e142d24e860551b4b24ba714595667652753a245e22a801561
s3.bucket-name=autoclaim
# Optional public base URL (e.g. https://pub-xxxx.r2.dev or a CDN domain).
# If empty, URLs are built path-style as {endpoint}/{bucket}/{key}.
s3.public-url=https://ltgidihkehlbivwfkqrh.supabase.co/storage/v1/object/public/autoclaim

# ===============================
# PYTHON AI MODULE (Direct HTTP)
# ===============================
app.ai.detect-url=${APP_AI_DETECT_URL:http://localhost:5000/api/ai/detect}
# Tiến độ AI (trạng thái trong RAM của ai-service): GET {status-url}/{sessionId}
app.ai.status-url=${APP_AI_STATUS_URL:http://localhost:5000/api/ai/status}

# ===============================
# RABBITMQ (Giao tiếp với Python YOLOv8)
# ===============================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Custom property định nghĩa tên queue để tái sử dụng trong các class cấu hình
app.rabbitmq.queue.ai-inspection=ai_inspection_queue

# ===============================
# JWT SECURITY (Custom Properties)
# ===============================
# Chuỗi secret key phải đủ dài (ít nhất 256-bit) để mã hóa thuật toán HS256
app.security.jwt.secret=AutoClaimSuperSecretKeyForJwtSignatureMustBeLongEnough
# Thời gian sống của token (VD: 86400000 ms = 24 giờ)
app.security.jwt.expiration-ms=86400000
