spring.application.name=backend

# ===============================
# SERVER & MULTIPART UPLOAD
# ===============================
server.port=8080

# Cực kỳ quan trọng: Tăng giới hạn payload để tránh lỗi 413 Payload Too Large khi gửi nhiều ảnh
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# POSTGRESQL DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/autoclaim_db
spring.datasource.username=postgres
spring.datasource.password=180704@db
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Flyway sẽ tự động đọc các file .sql nằm trong thư mục: src/main/resources/db/migration

# ===============================
# SPRING DATA JPA & HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Giao toàn quyền quản lý schema cho Flyway. Hibernate chỉ đối chiếu (validate) entity với bảng thực tế
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# PYTHON AI MODULE (Direct HTTP)
# ===============================
app.ai.detect-url=http://localhost:5000/api/ai/detect

# ===============================
# RABBITMQ (Giao tiếp với Python YOLOv8)
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom property định nghĩa tên queue để tái sử dụng trong các class cấu hình
app.rabbitmq.queue.ai-inspection=ai_inspection_queue

# ===============================
# JWT SECURITY (Custom Properties)
# ===============================
# Chuỗi secret key phải đủ dài (ít nhất 256-bit) để mã hóa thuật toán HS256
app.security.jwt.secret=AutoClaimSuperSecretKeyForJwtSignatureMustBeLongEnough
# Thời gian sống của token (VD: 86400000 ms = 24 giờ)
app.security.jwt.expiration-ms=86400000
